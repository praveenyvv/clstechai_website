<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dr. Reddy's Login — CLS Tech AI</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --bg-dark: #070c18;
      --bg-surface: #0c1424;
      --bg-card: rgba(13, 22, 38, 0.85);
      --border-subtle: rgba(255, 255, 255, 0.08);
      --border-focus: rgba(0, 212, 255, 0.4);
      --cyan: #00d4ff;
      --cyan-dim: rgba(0, 212, 255, 0.08);
      --text-white: #ffffff;
      --text-body: #94a3b8;
      --text-muted: #64748b;
      --error: #ef4444;
      --font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      --radius-sm: 6px;
      --radius-md: 10px;
      --radius-lg: 14px;
      --transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
    }

    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: var(--font-family);
      background-color: var(--bg-dark);
      color: var(--text-white);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 1.5rem 1rem;
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
    }

    .bg-mesh {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      background:
        radial-gradient(circle 600px at 70% 30%, rgba(0, 212, 255, 0.05), transparent 60%),
        radial-gradient(circle 500px at 30% 70%, rgba(0, 100, 220, 0.06), transparent 55%);
    }

    .bg-grid {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      background-image: 
        linear-gradient(rgba(255, 255, 255, 0.02) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 255, 255, 0.02) 1px, transparent 1px);
      background-size: 48px 48px;
    }

    .login-wrap {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 400px;
      margin: auto;
    }

    .back-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1rem;
    }

    .back-link {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      font-size: 0.84rem;
      font-weight: 500;
      color: var(--text-body);
      text-decoration: none;
      transition: var(--transition);
    }
    .back-link:hover { color: var(--text-white); }

    .brand-mark {
      font-size: 0.8rem;
      color: var(--text-muted);
    }
    .brand-mark span { color: var(--cyan); font-weight: 600; }

    /* CARD */
    .login-card {
      background: var(--bg-card);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-lg);
      padding: 2rem 1.75rem;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
      backdrop-filter: blur(14px);
    }

    .login-header {
      text-align: center;
      margin-bottom: 1.5rem;
    }

    .company-badge {
      width: 54px;
      height: 54px;
      background: var(--cyan-dim);
      border: 1px solid var(--border-focus);
      border-radius: var(--radius-md);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 1.7rem;
      margin-bottom: 0.85rem;
    }

    .login-header h1 {
      font-size: 1.25rem;
      font-weight: 700;
      color: var(--text-white);
      margin-bottom: 0.25rem;
    }

    .login-header p {
      font-size: 0.84rem;
      color: var(--text-body);
    }

    /* FORM */
    .form-group {
      margin-bottom: 1.1rem;
    }

    .form-group label {
      display: block;
      font-size: 0.76rem;
      font-weight: 600;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: var(--text-body);
      margin-bottom: 0.4rem;
    }

    .form-group input {
      width: 100%;
      background: rgba(7, 12, 24, 0.8);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-sm);
      padding: 0.7rem 0.95rem;
      font-family: var(--font-family);
      font-size: 0.92rem;
      color: var(--text-white);
      outline: none;
      transition: var(--transition);
    }

    .form-group input:focus {
      border-color: var(--cyan);
      box-shadow: 0 0 0 3px var(--cyan-dim);
    }

    .form-group input.error-field {
      border-color: var(--error);
    }

    .error-msg {
      display: none;
      background: rgba(239, 68, 68, 0.12);
      border: 1px solid rgba(239, 68, 68, 0.35);
      border-radius: var(--radius-sm);
      padding: 0.6rem 0.85rem;
      font-size: 0.82rem;
      color: #fca5a5;
      margin-bottom: 1.1rem;
      align-items: center;
      gap: 0.4rem;
    }
    .error-msg.visible {
      display: flex;
    }

    .btn-login {
      width: 100%;
      background: var(--cyan);
      color: #050d1a;
      font-weight: 600;
      font-size: 0.92rem;
      padding: 0.75rem;
      border: none;
      border-radius: var(--radius-sm);
      cursor: pointer;
      letter-spacing: 0.01em;
      transition: var(--transition);
      margin-top: 0.4rem;
    }

    .btn-login:hover:not(:disabled) {
      opacity: 0.9;
      transform: translateY(-1px);
      box-shadow: 0 6px 20px rgba(0, 212, 255, 0.3);
    }

    .btn-login:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .form-footer {
      margin-top: 1.25rem;
      text-align: center;
      font-size: 0.78rem;
      color: var(--text-muted);
    }

    .form-footer a {
      color: var(--cyan);
      font-weight: 500;
      text-decoration: none;
    }

    .secure-badge {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.4rem;
      margin-top: 1.25rem;
      font-size: 0.74rem;
      color: var(--text-muted);
    }

    .spinner {
      display: inline-block;
      width: 13px;
      height: 13px;
      border: 2px solid rgba(5, 13, 26, 0.3);
      border-top-color: #050d1a;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      margin-right: 6px;
      vertical-align: -2px;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>

  <div class="bg-mesh"></div>
  <div class="bg-grid"></div>

  <div class="login-wrap">
    <div class="back-row">
      <a href="customer-login.html" class="back-link">← Back to Portal</a>
      <div class="brand-mark">Powered by <span>CLS Tech AI</span></div>
    </div>

    <div class="login-card">
      <div class="login-header">
        <div class="company-badge">🧪</div>
        <h1>Dr. Reddy's Laboratories</h1>
        <p>Sign in to access your operations dashboard</p>
      </div>

      <div class="error-msg" id="errorMsg">⚠️ Invalid credentials. Please try again.</div>

      <form onsubmit="event.preventDefault(); handleLogin();">
        <div class="form-group">
          <label for="loginId">Login ID</label>
          <input type="text" id="loginId" placeholder="Enter your login ID" autocomplete="username" required>
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" placeholder="Enter your password" autocomplete="current-password" required>
        </div>

        <button type="submit" class="btn-login" id="loginBtn">
          Sign In to Dashboard
        </button>
      </form>

      <div class="form-footer">
        Need access? <a href="mailto:praveenyvv@clstechai.com">Contact CLS Tech AI</a>
      </div>
    </div>

    <div class="secure-badge">
      🔒 Secured by CLS Tech AI · End-to-end encrypted session
    </div>
  </div>

  <script>
    const CREDENTIALS = { loginId: '12345', password: '12345' };
    const SESSION_KEY = 'cls_drl_auth';
    const SESSION_TOKEN = 'drl_auth_granted_2025';

    if (sessionStorage.getItem(SESSION_KEY) === SESSION_TOKEN) {
      window.location.replace('drl_dashboard.html');
    }

    function handleLogin() {
      const loginIdInput = document.getElementById('loginId');
      const passwordInput = document.getElementById('password');
      const loginId = loginIdInput.value.trim();
      const password = passwordInput.value;
      const btn = document.getElementById('loginBtn');
      const errEl = document.getElementById('errorMsg');

      errEl.classList.remove('visible');
      loginIdInput.classList.remove('error-field');
      passwordInput.classList.remove('error-field');

      if (!loginId || !password) {
        errEl.textContent = '⚠️ Please fill in both fields.';
        errEl.classList.add('visible');
        return;
      }

      btn.disabled = true;
      btn.innerHTML = '<span class="spinner"></span> Signing in…';

      setTimeout(() => {
        if (loginId === CREDENTIALS.loginId && password === CREDENTIALS.password) {
          sessionStorage.setItem(SESSION_KEY, SESSION_TOKEN);
          btn.innerHTML = '✓ Access Granted — Redirecting…';
          setTimeout(() => {
            window.location.replace('drl_dashboard.html');
          }, 500);
        } else {
          btn.disabled = false;
          btn.innerHTML = 'Sign In to Dashboard';
          errEl.textContent = '⚠️ Invalid credentials. Please try again.';
          errEl.classList.add('visible');
          loginIdInput.classList.add('error-field');
          passwordInput.classList.add('error-field');
        }
      }, 700);
    }
  </script>

</body>
</html>
